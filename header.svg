<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Aymen Rahmani — LLM and agents engineer. Retrieve, reason, evaluate, gate, ship.">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="150" x2="1050" y1="0" y2="0">
      <stop offset="0" stop-color="#8B949E" stop-opacity="0"/>
      <stop offset=".15" stop-color="#8B949E" stop-opacity=".9"/>
      <stop offset=".85" stop-color="#8B949E" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8B949E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .name{font:700 58px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:1px}
    .sub{font:500 21px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#8B949E;letter-spacing:.5px}
    .lab{font:600 15px ui-monospace,'SFMono-Regular',Consolas,monospace;fill:#8B949E}
    .ok{font:700 13px ui-monospace,'SFMono-Regular',Consolas,monospace;fill:#22C55E}
  </style>
  <text x="600" y="78" text-anchor="middle" class="name" fill="url(#g)">Aymen Rahmani</text>
  <text x="600" y="114" text-anchor="middle" class="sub">LLM &amp; Agents Engineer · RAG · Evaluation · Guardrails · MCP</text>

  <!-- pipeline -->
  <g stroke="#8B949E" stroke-opacity=".8" stroke-width="2" stroke-dasharray="5 5"><line x1="262" y1="205" x2="333" y2="205"/><line x1="467" y1="205" x2="538" y2="205"/><line x1="672" y1="205" x2="743" y2="205"/><line x1="877" y1="205" x2="948" y2="205"/></g>
  <g fill="none" stroke="url(#g)" stroke-width="2">
    <rect x="130" y="183" width="130" height="44" rx="22"/>
    <rect x="335" y="183" width="130" height="44" rx="22"/>
    <rect x="540" y="183" width="130" height="44" rx="22"/>
    <rect x="745" y="183" width="130" height="44" rx="22" stroke-width="3"/>
    <rect x="950" y="183" width="130" height="44" rx="22"/>
  </g>
  <g class="lab" text-anchor="middle">
    <text x="195" y="210">retrieve</text>
    <text x="400" y="210">reason</text>
    <text x="605" y="210">evaluate</text>
    <text x="810" y="210">gate</text>
    <text x="1015" y="210">ship</text>
  </g>
  <text x="810" y="252" text-anchor="middle" class="ok">ALLOW ✓</text>
  <text x="605" y="252" text-anchor="middle" class="lab" style="font-size:12px">measure before claiming</text>

  <!-- moving token -->
  <circle r="5" fill="#0EA5E9">
    <animateMotion dur="6s" repeatCount="indefinite" path="M262,205 L948,205"/>
    <animate attributeName="opacity" calcMode="discrete" values="1;0;1;0;1;0;1" keyTimes="0;.104;.299;.403;.598;.702;.897" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#0EA5E9;#8B5CF6;#22C55E" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
